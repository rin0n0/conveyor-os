# Conveyor OS: scenario-based LLM router (llama-swap), GPU profile for 7+ GB VRAM.
# Roles point at /var/lib/models/active-<role>.gguf, assigned with conveyor-model.
# The role names must match config-cpu-only.yaml so clients work on any PC.

healthCheckTimeout: 300
logLevel: info
globalTTL: 1800
startPort: 10001

routing:
  router:
    use: group
    settings:
      groups:
        "gpu_models":
          swap: true
          exclusive: false
          members:
            - "coder"
            - "fast"
            - "think"
        "always_on":
          swap: false
          exclusive: false
          persistent: true
          members:
            - "embed"

models:
  # Primary coding model (Aider, OpenCode, editors)
  "coder":
    cmd: >
      llama-server
      --model /var/lib/models/active-coder.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 32768
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    aliases: ["claude-3-5-sonnet", "gpt-4o", "qwen-coder", "default"]
    ttl: 3600

  # Fast triage and chat
  "fast":
    cmd: >
      llama-server
      --model /var/lib/models/active-fast.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 16384
      --flash-attn on
      --jinja
    aliases: ["gpt-4o-mini", "fast-triage", "chat", "local-fast"]
    ttl: 900

  # Deep reasoning, math and logic
  "think":
    cmd: >
      llama-server
      --model /var/lib/models/active-think.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 32768
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    aliases: ["o1", "deepseek-r1", "reasoning", "local-deep"]
    ttl: 1800

  # Semantic search and RAG embeddings (CPU, 0 MB VRAM)
  "embed":
    cmd: >
      llama-server
      --model /var/lib/models/active-embed.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 0
      --embeddings
      --pooling last
    aliases: ["rag-embed", "text-embedding-3-small"]
