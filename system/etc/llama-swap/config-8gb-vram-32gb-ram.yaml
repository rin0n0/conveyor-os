# Conveyor OS: Dynamic Scenario-Based LLM Router (llama-swap)
# Optimized for 8 GB VRAM + dynamic CPU offload
# Models are managed and tagged via 'conveyor-model' (linking to /var/lib/models/active-*.gguf)

healthCheckTimeout: 300
logLevel: info
globalTTL: 1800
startPort: 10001

groups:
  "vram_8gb_exclusive":
    swap: true
    members:
      - "coder"
      - "fast"
      - "think"

models:
  # Scenario 1: Primary Coding Model (Aider, OpenCode, VS Code)
  "coder":
    cmd: >
      llama-server
      --model /var/lib/models/active-coder.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 32768
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    aliases: ["coder", "claude-3-5-sonnet", "gpt-4o", "qwen-coder", "default"]
    ttl: 3600
    group: "vram_8gb_exclusive"

  # Scenario 2: Fast Triage & Chat Model
  "fast":
    cmd: >
      llama-server
      --model /var/lib/models/active-fast.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 16384
      --flash-attn on
      --jinja
    aliases: ["fast", "gpt-4o-mini", "fast-triage", "chat", "local-fast"]
    ttl: 900
    group: "vram_8gb_exclusive"

  # Scenario 3: Deep Reasoning & Complex Math / Logic (DeepSeek-R1 / QwQ)
  "think":
    cmd: >
      llama-server
      --model /var/lib/models/active-think.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 99
      --ctx-size 32768
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    aliases: ["think", "o1", "deepseek-r1", "reasoning", "local-deep"]
    ttl: 1800
    group: "vram_8gb_exclusive"

  # Scenario 4: Semantic Search & RAG Embeddings (CPU-based, 0 MB VRAM)
  "embed":
    cmd: >
      llama-server
      --model /var/lib/models/active-embed.gguf
      --port ${PORT}
      --host 127.0.0.1
      -ngl 0
      --embeddings
      --pooling last
    aliases: ["embed", "rag-embed", "text-embedding-3-small"]
    persistent: true
