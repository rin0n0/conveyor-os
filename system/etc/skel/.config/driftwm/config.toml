# DriftWM configuration for Conveyor OS (2D Spatial Project Islands)
mod_key = "super"

[keybindings]
"mod+return"      = "exec-terminal"
"mod+d"           = "exec-launcher"
"mod+space"       = "exec-launcher"
"mod+p"           = "exec /usr/local/bin/project-switcher.sh"
"mod+v"           = "exec sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'"
"mod+q"           = "close-window"
"mod+f"           = "toggle-fullscreen"
"mod+m"           = "exec /usr/local/bin/driftmap-toggle.sh"
"mod+c"           = "center-window"
"mod+Tab"         = "cycle-windows forward"
"mod+shift+Tab"   = "cycle-windows backward"
"mod+h"           = "focus-nearest left"
"mod+j"           = "focus-nearest down"
"mod+k"           = "focus-nearest up"
"mod+l"           = "focus-nearest right"
"mod+equal"       = "zoom-in"
"mod+minus"       = "zoom-out"
"mod+0"           = "zoom-reset"
"mod+shift+w"     = "zoom-to-fit-snapped"
"mod+shift+c"     = "reload-config"
