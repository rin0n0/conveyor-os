# DriftWM configuration for Conveyor OS (2D Spatial Project Islands)
mod_key = "super"

autostart = [
    "waybar",
    "swaync",
    "wl-paste --type text --watch cliphist store",
    "blueman-applet"
]

[input.keyboard]
layout = "us,ru"

[keybindings]
"alt+shift"       = "switch-layout next"
"mod+shift+s"     = "exec /usr/local/bin/conveyor-screenshot.sh"
"mod+shift+b"     = "exec blueman-manager"
"mod+shift+m"     = "spawn driftmap --toggle 2 242424cc"
"mod+return"      = "spawn foot"
"mod+d"           = "spawn fuzzel"
"mod+space"       = "spawn fuzzel"
"mod+p"           = "exec /usr/local/bin/project-switcher.sh"
"mod+n"           = "spawn nm-connection-editor"
"mod+shift+n"     = "exec /usr/local/bin/net-switch.sh"
"mod+grave"       = "exec /usr/local/bin/conveyor-live-stt.sh"
"mod+F1"          = "spawn foot -e conveyor-help"
"mod+v"           = "exec sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'"
"mod+q"           = "close-window"
"mod+f"           = "toggle-fullscreen"
"mod+m"           = "exec /usr/local/bin/driftmap-toggle.sh"
"mod+c"           = "center-window"
"mod+Tab"         = "cycle-windows forward"
"mod+shift+Tab"   = "cycle-windows backward"
"mod+h"           = "focus-nearest left"
"mod+j"           = "focus-nearest down"
"mod+k"           = "focus-nearest up"
"mod+l"           = "focus-nearest right"
"mod+equal"       = "zoom-in"
"mod+minus"       = "zoom-out"
"mod+0"           = "zoom-reset"
"mod+shift+w"     = "zoom-to-fit-snapped"
"mod+shift+c"     = "reload-config"
