# Global mise configuration (all CAS caches remain inside @home for Btrfs hardlinks)
[env]
UV_LINK_MODE = "hardlink"
UV_CACHE_DIR = "{{env.HOME}}/.cache/uv"
SCCACHE_CACHE_SIZE = "8G"
RUSTC_WRAPPER = "sccache"
CCACHE_MAXSIZE = "4G"
PLAYWRIGHT_BROWSERS_PATH = "{{env.HOME}}/.cache/ms-playwright"
ANTHROPIC_BASE_URL = "http://127.0.0.1:8080"
OPENAI_BASE_URL = "http://127.0.0.1:8080/v1"

[settings]
experimental = true
