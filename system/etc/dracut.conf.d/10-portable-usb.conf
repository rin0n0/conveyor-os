# Hardware-agnostic initramfs: reach and unlock the root disk on any UEFI PC
hostonly="no"
add_dracutmodules+=" systemd-cryptsetup crypt btrfs ostree "
add_drivers+=" xhci_pci xhci_hcd ehci_pci ehci_hcd ohci_pci ohci_hcd uhci_hcd usb_storage uas sd_mod ahci nvme dm_crypt btrfs usbhid hid_generic "
# GPU drivers load later from the root filesystem, after the boot menu choice applies
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nouveau "
install_items+=" /etc/udev/rules.d/10-usb-sata-jms578.rules "
